# ===== native_sim 外设学习示例：应用配置 =====
# 目标板 native_sim 已默认提供以下外设模型（见 native_sim.dts）：
#   - gpio0     : zephyr,gpio-emul        （可被程序读写的 GPIO 仿真控制器）
#   - led0      : 挂在 gpio0 pin0 上      （GPIO 输出）
#   - eeprom0   : zephyr,sim-eeprom        （EEPROM 仿真，落盘到 eeprom.bin）
#   - rng       : zephyr,native-posix-rng  （熵源/随机数模型）

# GPIO 子系统 + GPIO 仿真器
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# EEPROM 子系统（配套的 EEPROM_SIMULATOR 由 DTS 自动使能）
CONFIG_EEPROM=y

# 熵源子系统（配套的 FAKE_ENTROPY_NATIVE_POSIX 由 DTS 自动使能）
CONFIG_ENTROPY_GENERATOR=y

# 控制台 / 日志
CONFIG_PRINTK=y
CONFIG_LOG=y